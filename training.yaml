# Training configuration
GPU: [0]

VERBOSE: False

SWINUNET:
  IMG_SIZE: 128
  PATCH_SIZE: 4
  WIN_SIZE: 8
  EMB_DIM: 96
  DEPTH_EN: [4, 4, 4, 4]
  HEAD_NUM: [4, 4, 4, 4]
  MLP_RATIO: 4.0
  QKV_BIAS: True
  QK_SCALE: 8
  DROP_RATE: 0.
  ATTN_DROP_RATE: 0.
  DROP_PATH_RATE: 0.1
  APE: False
  PATCH_NORM: True
  USE_CHECKPOINTS: False
  FINAL_UPSAMPLE: 'Dual up-sample'

MODEL:
  MODE: 'Denoising'
  IN_CHANS: 3
  OUT_CHANS: 1

DATASET:
  FORMAT: brats_nifti
  INPUT_MODALITIES: ['t1n', 't2w', 't2f']
  TARGET_MODALITY: 't1c'
  SLICE_AXIS: 2
  SKIP_EMPTY_TARGET: True
  MIN_TARGET_PIXELS: 1
  CACHE_VOLUMES: True
  SPLIT_SEED: 1234
  TRAIN_RATIO: 0.7
  VAL_RATIO: 0.15
  TEST_RATIO: 0.15

# 🔧 Loss function configuration
LOSS:
  TYPE: 'L1+SSIM'        # Combines L1 loss with SSIM loss
  SSIM_WEIGHT: 0.15      # Weight for SSIM loss component

# Optimization arguments.
OPT:
  BATCH: 1
  EPOCHS: 20
  # EPOCH_DECAY: [10]
  LR_INITIAL: 2e-4
  LR_MIN: 1e-6
  # BETA1: 0.9

TRAINING:
  VAL_AFTER_EVERY: 1
  RESUME: False
  TRAIN_PS: 128
  VAL_PS: 128
  TEST_PS: 128
  TRAIN_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/Training
  VAL_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/Training
  TEST_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/Training
  SAVE_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/IC-Transformer-checkpoints

TESTING:
  MODEL_PATH: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/IC-Transformer-checkpoints/Denoising/models/model_bestSSIM.pth
  TEST_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/Training
  RESULT_DIR: /media/cheema/aefeca2e-d141-40f6-beb3-cbc443e70045/cheema/BraTS-PEDs-v1/IC-Transformer-checkpoints/Denoising/test_visuals
  MAX_VISUALS: 50
